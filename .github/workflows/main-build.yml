name: Main build

# The release's Windows build of a commit on main, for Atlas's "Reinstall on
# JASON-PC". Started by hand only: Atlas starts it on main from its window.
# The workspace version is stamped <version>+main.<sha7> (scripts/
# stamp-version.ps1), so the window, vmm.exe and the installer all name the
# commit, and the app's own updater still offers the next real release.
#
# It uploads the installer and SHA256SUMS.txt as the workflow artifact
# vaexil-mod-manager-main-<full commit sha>, kept 7 days. It makes no GitHub
# release and never touches the update feed. This repository is public, so
# any signed-in GitHub user can download the artifact; the source is public
# under GPL-3.0 anyway, and Atlas checks the SHA-256 before installing.
#
# Started on any other branch, the build is stamped +branch.<sha7> and named
# vaexil-mod-manager-branch-<sha>, so it can be checked but is never taken for
# a build from main.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # Before the stamp, so the tests see the committed version.
      - name: Test
        run: cargo test --workspace --locked

      - name: Stamp the version
        id: stamp
        shell: pwsh
        run: |
          $channel = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'main' } else { 'branch' }
          if ($channel -ne 'main') { Write-Output "::notice::$env:GITHUB_REF is not main, so this build is stamped +branch." }
          $stamped = ./scripts/stamp-version.ps1 -Sha $env:GITHUB_SHA -Channel $channel
          "version=$stamped" >> $env:GITHUB_OUTPUT
          "artifact=vaexil-mod-manager-$channel-$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      # Installs into the runner's temp folder only, then uninstalls.
      - name: Read the version back
        shell: pwsh
        env:
          STAMPED: ${{ steps.stamp.outputs.version }}
        run: |
          $setup = "dist\VaexilModManager-$env:STAMPED-setup.exe"
          if (-not (Test-Path $setup)) { throw "No installer at $setup" }
          $info = (Get-Item $setup).VersionInfo
          Write-Output "Installer file version: $($info.FileVersion); product version: $($info.ProductVersion)"

          $dir = Join-Path $env:RUNNER_TEMP 'vmm-readback'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)" }
          $app = (& "$dir\vmm.exe" version --json | ConvertFrom-Json).appVersion
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{B7D9C2A4-5E3F-4C61-8F2A-9D4E7A1C3B58}_is1'
          $display = (Get-ItemProperty $key).DisplayVersion
          Write-Output "Installed vmm.exe: $app; Apps & features DisplayVersion: $display"
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($app -ne $env:STAMPED) { throw "vmm.exe says $app, not $env:STAMPED" }
          if ($display -ne $env:STAMPED) { throw "DisplayVersion is $display, not $env:STAMPED" }
          if ($u.ExitCode -ne 0) { throw "The uninstaller exited with $($u.ExitCode)" }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stamp.outputs.artifact }}
          path: |
            dist/VaexilModManager-${{ steps.stamp.outputs.version }}-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
